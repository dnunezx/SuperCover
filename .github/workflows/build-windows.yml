name: Build portable Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Install application and pinned build tool
        run: python -m pip install . -r requirements-build.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build the one-file Windows application
        shell: pwsh
        run: .\scripts\build_windows.ps1 -OutputDirectory "$PWD\dist"
      - name: Test the frozen executable and version resource
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "supercover-self-test.json"
          $process = Start-Process -FilePath ".\dist\SuperCover.exe" `
            -ArgumentList @("--self-test", $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen self-test failed with exit code $($process.ExitCode)"
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne "ok" -or -not $result.frozen) {
            throw "Frozen self-test report is invalid"
          }
          $version = (Get-Item ".\dist\SuperCover.exe").VersionInfo
          if ($version.ProductVersion -ne "0.5.0.0") {
            throw "Unexpected product version: $($version.ProductVersion)"
          }
          Get-Content -LiteralPath $report
      - name: Create the portable release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\release" -Force | Out-Null
          Copy-Item ".\dist\SuperCover.exe" ".\release\SuperCover.exe"
          Copy-Item ".\LICENSE" ".\release\LICENSE.txt"
          Copy-Item ".\THIRD_PARTY_NOTICES.md" ".\release\THIRD_PARTY_NOTICES.md"
          Copy-Item ".\README.md" ".\release\README.md"
          $exeHash = (Get-FileHash ".\release\SuperCover.exe" -Algorithm SHA256).Hash
          "$exeHash  SuperCover.exe" | Set-Content `
            ".\release\SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path ".\release\*" `
            -DestinationPath ".\SuperCover-0.5.0-windows-x64.zip" -Force
          Get-FileHash ".\SuperCover-0.5.0-windows-x64.zip" -Algorithm SHA256
      - name: Upload the portable application
        uses: actions/upload-artifact@v7
        with:
          path: SuperCover-0.5.0-windows-x64.zip
          archive: false
          retention-days: 30
